<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution Holding Зээлийн Вэбсайт</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar and smooth scrolling */
    html {
      scroll-behavior: smooth;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981; 
    }
  </style>
</head>
<body class="bg-slate-950">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icon Helper Component
    // Lucide React is not directly available via CDN without a bundler, 
    // so we create a simple wrapper for raw SVG strings or create simple versions.
    const Icon = ({ name, size = 24, className = "" }) => {
      const icons = {
        CarFront: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/></svg>`,
        SquareParking: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>`,
        Smartphone: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>`,
        Clock: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
        ShieldCheck: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>`,
        Zap: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
        ChevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m9 18 6-6-6-6"/></svg>`,
        Calculator: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>`,
        CheckCircle2: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>`,
        Facebook: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`,
        Phone: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
        MapPin: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
        Sun: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
        Moon: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
        X: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`
      };
      
      return <span dangerouslySetInnerHTML={{ __html: icons[name] || '' }} />;
    };

    // Зээл судлуулах Modal Component
    const LoanRequestModal = ({ isOpen, onClose, isDark }) => {
      if (!isOpen) return null;

      const links = {
        number: "https://docs.google.com/forms/d/e/1FAIpQLScEFowibJT3rTZxz6dM6u69Lu0RwwQeFgQrLvLwB5uYuQIZzQ/viewform",
        car: "https://docs.google.com/forms/d/e/1FAIpQLSe1MaLmjs4IqSKeqwoBRVKe0beHhIQG0zWzK518WAz3xFg2Bw/viewform"
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
          <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl transition-colors ${isDark ? 'bg-slate-900 border border-slate-800' : 'bg-white'}`}>
            <button 
              onClick={onClose}
              className={`absolute top-4 right-4 p-2 rounded-full transition-colors ${isDark ? 'hover:bg-slate-800 text-slate-400' : 'hover:bg-slate-100 text-slate-500'}`}
            >
              <Icon name="X" size={20} />
            </button>
            
            <h3 className={`text-2xl font-bold mb-2 ${isDark ? 'text-white' : 'text-slate-900'}`}>Зээл судлуулах</h3>
            <p className={`mb-6 text-sm ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>Та ямар төрлийн зээл судлуулах хүсэлтэй байна вэ?</p>

            <div className="space-y-3">
              <a 
                href={links.car}
                target="_blank"
                rel="noopener noreferrer"
                onClick={onClose}
                className={`flex items-center gap-4 p-4 rounded-2xl border transition-all hover:border-emerald-500 group ${isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}
              >
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors ${isDark ? 'bg-slate-800 text-emerald-400' : 'bg-emerald-100 text-emerald-600'}`}>
                  <Icon name="CarFront" size={24} />
                </div>
                <div>
                  <h4 className={`font-bold ${isDark ? 'text-white' : 'text-slate-900'}`}>Автомашины зээл</h4>
                  <p className={`text-xs ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Унаад явах болон зогсоолд байршуулах</p>
                </div>
              </a>

              <a 
                href={links.number}
                target="_blank"
                rel="noopener noreferrer"
                onClick={onClose}
                className={`flex items-center gap-4 p-4 rounded-2xl border transition-all hover:border-emerald-500 group ${isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}
              >
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors ${isDark ? 'bg-slate-800 text-emerald-400' : 'bg-emerald-100 text-emerald-600'}`}>
                  <Icon name="Smartphone" size={24} />
                </div>
                <div>
                  <h4 className={`font-bold ${isDark ? 'text-white' : 'text-slate-900'}`}>8811 дугаарын зээл</h4>
                  <p className={`text-xs ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Юнителийн 8811 дугаар барьцаалсан</p>
                </div>
              </a>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [isDark, setIsDark] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className={`min-h-screen font-sans selection:bg-emerald-500 selection:text-white transition-colors duration-300 ${isDark ? 'bg-slate-950 text-slate-200' : 'bg-slate-50 text-slate-800'}`}>
          
          {/* Navigation */}
          <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? (isDark ? 'bg-slate-900/95 shadow-emerald-500/10 shadow-lg py-3 backdrop-blur-md' : 'bg-white/95 shadow-emerald-500/10 shadow-lg py-3 backdrop-blur-md') : 'bg-transparent py-5'}`}>
            <div className="container mx-auto px-6 lg:px-12 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-500/30">
                  Э
                </div>
                <div className="font-bold text-xl leading-none">
                  <span className={`block transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>Evolution</span>
                  <span className="text-emerald-500 text-sm">Holding</span>
                </div>
              </div>
              <div className={`hidden md:flex gap-8 font-medium text-sm transition-colors ${isDark ? 'text-slate-200' : 'text-slate-700'}`}>
                <a href="#about" className="hover:text-emerald-500 transition-colors">Бидний тухай</a>
                <a href="#products" className="hover:text-emerald-500 transition-colors">Бүтээгдэхүүн</a>
                <a href="#calculator" className="hover:text-emerald-500 transition-colors">Тооцоолуур</a>
              </div>
              <div className="flex items-center gap-3 sm:gap-6">
                
                {/* Dark/Light Mode Toggle */}
                <button 
                  onClick={() => setIsDark(!isDark)}
                  className={`p-2 rounded-full transition-colors ${isDark ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
                  aria-label="Toggle Dark Mode"
                >
                  {isDark ? <Icon name="Sun" size={18} /> : <Icon name="Moon" size={18} />}
                </button>

                <a href="http://www.evo.mn/login" className={`hidden sm:block text-sm font-bold transition-colors ${isDark ? 'text-slate-200 hover:text-emerald-400' : 'text-slate-700 hover:text-emerald-500'}`}>
                  Нэвтрэх
                </a>
                <button onClick={() => setIsModalOpen(true)} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 px-5 sm:px-6 rounded-full transition-all hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] transform hover:-translate-y-0.5 inline-block text-center text-sm sm:text-base">
                  Зээл судлуулах
                </button>
              </div>
            </div>
          </nav>

          {/* Hero Section */}
          <header className="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden">
            <div className="absolute inset-0 z-0 pointer-events-none">
              <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-600/20 rounded-full blur-[100px]"></div>
              <div className="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-teal-600/20 rounded-full blur-[120px]"></div>
            </div>
            
            <div className="container mx-auto px-6 lg:px-12 relative z-10 grid lg:grid-cols-2 gap-12 items-center">
              <div>
                <div className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-sm font-medium mb-6 transition-colors ${isDark ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>
                  <Icon name="Zap" size={16} className={isDark ? 'fill-emerald-400 text-emerald-400' : 'fill-emerald-500 text-emerald-500'} />
                  <span>Ердөө 15 минутанд шийднэ</span>
                </div>
                <h1 className={`text-5xl lg:text-7xl font-extrabold leading-tight mb-6 tracking-tight transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  Танд үнэ цэнэтэй <br />
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-teal-400">
                    хөрөнгө бий.
                  </span>
                </h1>
                <p className={`text-lg mb-8 leading-relaxed max-w-lg transition-colors ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>
                  Банкны урт хүлээлт, олон шатны бичиг баримтаас залхаж байна уу? Бид таны автомашин болон 8811 дугаарыг ажиллуулж, яг одоо хэрэгтэй байгаа санхүүжилтийг чинь олгоно.
                </p>
                <div className="flex flex-col sm:flex-row gap-4">
                  <a href="#products" className="group bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 px-8 rounded-full text-center transition-all duration-300 hover:shadow-[0_0_30px_rgba(16,185,129,0.4)] flex justify-center items-center gap-2 transform hover:-translate-y-1">
                    <Icon name="Zap" size={20} className="text-slate-900 group-hover:scale-125 transition-transform duration-300" />
                    <span>Өөрт тохирох зээлээ сонгох</span> 
                    <Icon name="ChevronRight" size={20} className="transform transition-transform duration-300 group-hover:translate-x-1.5" />
                  </a>
                  <a href="#calculator" className={`group font-semibold py-4 px-8 rounded-full text-center transition-all duration-300 border flex justify-center items-center gap-2 transform hover:-translate-y-1 ${isDark ? 'bg-slate-800 hover:bg-slate-700 text-white border-slate-700 hover:border-slate-600' : 'bg-white hover:bg-slate-100 text-slate-900 border-slate-300 hover:border-slate-400'}`}>
                    <Icon name="Calculator" size={20} className="transform transition-all duration-300 group-hover:rotate-12 group-hover:text-emerald-500" /> 
                    Тооцоолуур
                  </a>
                </div>
              </div>
              
              <div className="relative hidden lg:block">
                <div className="absolute inset-0 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-3xl transform rotate-3 opacity-20 blur-lg"></div>
                <div className={`p-8 rounded-3xl relative z-10 shadow-2xl backdrop-blur-sm transition-colors border ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white/90 border-white'}`}>
                  <div className="flex justify-between items-center mb-8">
                    <h3 className={`text-xl font-bold transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>Бидний давуу тал</h3>
                    <Icon name="ShieldCheck" className="text-emerald-500" size={28} />
                  </div>
                  <div className="space-y-6">
                    {[
                      { title: 'Албан ёсны зөвшөөрөлтэй', desc: 'СЗХ-ны А/316 тусгай зөвшөөрөлтэй, хуулийн дагуу.', iconName: 'ShieldCheck' },
                      { title: 'Урт хугацааны туршлага', desc: '2015 оноос хойш тасралтгүй үйл ажиллагаа явуулж байна.', iconName: 'Clock' },
                      { title: 'Уян хатан, хурдан', desc: 'Ердөө 15 минутад зээл шийдвэрлэх боломжтой.', iconName: 'Zap' }
                    ].map((item, idx) => (
                      <div key={idx} className="flex gap-4 items-start">
                        <div className={`w-12 h-12 rounded-full flex-shrink-0 flex items-center justify-center text-emerald-500 transition-colors ${isDark ? 'bg-slate-800' : 'bg-emerald-50'}`}>
                          <Icon name={item.iconName} size={24} />
                        </div>
                        <div>
                          <h4 className={`font-bold text-lg transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>{item.title}</h4>
                          <p className={`text-sm transition-colors ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>{item.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </header>

          {}
          <section id="products" className={`py-24 relative transition-colors ${isDark ? 'bg-slate-900' : 'bg-slate-100'}`}>
            <div className="container mx-auto px-6 lg:px-12">
              <div className="text-center max-w-2xl mx-auto mb-16">
                <h2 className={`text-3xl md:text-5xl font-bold mb-6 transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>Ямар зээл хайж байна вэ?</h2>
                <p className={`text-lg transition-colors ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>Та өөрийн нөхцөл байдалд хамгийн сайн тохирох сонголтыг хийгээрэй.</p>
              </div>

              <div className="grid md:grid-cols-3 gap-8">
                {/* Product 1 */}
                <div className={`border rounded-3xl p-8 transition-all group relative overflow-hidden ${isDark ? 'bg-slate-950 border-slate-800 hover:border-emerald-500/50' : 'bg-white border-slate-200 hover:border-emerald-500/50 shadow-sm'}`}>
                  <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <Icon name="CarFront" size={100} className="text-emerald-500" />
                  </div>
                  <div className={`w-16 h-16 rounded-2xl border flex items-center justify-center text-emerald-500 mb-6 group-hover:scale-110 transition-transform ${isDark ? 'bg-slate-900 border-slate-800 shadow-lg shadow-emerald-500/10' : 'bg-slate-50 border-slate-100'}`}>
                    <Icon name="CarFront" size={32} />
                  </div>
                  <h3 className={`text-2xl font-bold mb-3 leading-tight transition-colors ${isDark ? 'text-white' : 'text-slate-900'}`}>Автомашинаа унаад явах зээл</h3>
                  <p className={`mb-6 min-h-[80px] transition-colors ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>Машинаа барьцаалсан ч түлхүүрээ өгөх шаардлагагүй. Өдөр тутмын хэрэгцээндээ ашигласан хэвээрээ зээлээ авна.</p>
                  
                  <ul className={`space-y-3 mb-8 transition-colors ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>
                    <li className="flex items-center gap-2 text-sm"><Icon name="CheckCircle2" size={16} className="text-emerald-500" /> Хүү: 3.6% - 3.9%</li>
                    <li className="flex items-center gap-2 text-sm"><Icon name="CheckCircle2" size={16} className="text-emerald-500" /> Хугацаа: 24 сар хүртэл</li>
                    <li className="flex items-center gap-2 text-sm"><Icon name="CheckCircle2" size={16} className="text-emerald-500" /> Хэмжээ: Үнэлгээний 40% хүртэл</li>
                  </ul>
                  <button onClick={() => setIsModalOpen(true)} className={`block text-center w-full font-semibold py-3 rounded-xl transition-all ${isDark ? 'bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-white' : 'bg-slate-100 hover:bg-emerald-500 hover:text-white text-slate-900'}`}>Сонгох</button>

const CalculatorSection = ({ isDark, onOpenModal }) => {
  const [productType, setProductType] = useState('drive'); // drive, park, number
  const [amount, setAmount] = useState(5000000);
      const [months, setMonths] = useState(12);

      // Конфигураци
      const products = {
        drive: { name: 'Машин унаад явах', rate: 0.039, maxMonths: 24, maxAmount: 100000000 },
        park: { name: 'Зогсоолд байршуулах', rate: 0.035, maxMonths: 12, maxAmount: 200000000 },
        number: { name: '8811 дугаар', rate: 0.035, maxMonths: 24, maxAmount: 13000000 }
      };

      const currentConfig = products[productType];

      // Зээлийн дүн өөрчлөгдөхөд хязгаар шалгах
      useEffect(() => {
        if (amount > currentConfig.maxAmount) {
          setAmount(currentConfig.maxAmount);
        }
        if (months > currentConfig.maxMonths) {
          setMonths(currentConfig.maxMonths);
        }
      }, [productType]);

      const calculateEMI = () => {
        const P = amount;
        const r = currentConfig.rate;
        const n = months;
        
        if (n === 0 || P === 0) return 0;
        const emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        return Math.round(emi);
      };

      const monthlyPayment = calculateEMI();
      const totalPayment = monthlyPayment * months;

        return new Intl.NumberFormat('mn-MN').format(val) + ' ₮';
