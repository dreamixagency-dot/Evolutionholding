    const CalculatorSection = ({ isDark, onOpenModal }) => {
      const [productType, setProductType] = useState('drive');
      const [amount, setAmount] = useState(5000000);
      const [months, setMonths] = useState(12);
      const [isScheduleOpen, setIsScheduleOpen] = useState(false);
      const [scheduleData, setScheduleData] = useState([]);
      const [isDownloading, setIsDownloading] = useState(false);

      const products = {
        drive: { name: 'Машин унаад явах', rate: 0.039, maxMonths: 60, maxAmount: 300000000 },
        park: { name: 'Зогсоолд байршуулах', rate: 0.036, maxMonths: 60, maxAmount: 300000000 },
        number: { name: '8811 дугаар', rate: 0.036, maxMonths: 60, maxAmount: 300000000 }
      };

      const currentConfig = products[productType];

      useEffect(() => {
        if (amount > currentConfig.maxAmount) setAmount(currentConfig.maxAmount);
        if (months > currentConfig.maxMonths) setMonths(currentConfig.maxMonths);
      }, [productType]);

      useEffect(() => {
        const generateSchedule = () => {
          if (!amount || !months || !currentConfig.rate) return [];
          const sched = [];
          let balance = amount;
          const r = currentConfig.rate; // Сарын нэрлэсэн хүү (3.9%)
          const n = months;
          const annualRate = r * 12; // Жилийн хүү (46.8%)
          
          // Банкны 365 хоногийн хуанлид суурилсан жигнэсэн сарын хүү (365 хоногийн дундаж хоногоор тэгшитгэх)
          // 365 хоногтой жилд 1 сарын дундаж хоног = 365 / 12 = 30.4166667
          const avgDaysInMonth = 365 / 12;
          const bankMonthlyRate = (annualRate / 365) * avgDaysInMonth;

          // Банкны бодит тэнцүү төлбөрийн стандарт үр дүн
          const fixedMonthlyPayment = (amount * bankMonthlyRate * Math.pow(1 + bankMonthlyRate, n)) / (Math.pow(1 + bankMonthlyRate, n) - 1);

          const startDate = new Date();
          const anchorDay = startDate.getDate();
          let previousDate = new Date(startDate);
          
          for (let i = 1; i <= months; i++) {
            const nextDate = new Date(startDate.getFullYear(), startDate.getMonth() + i, anchorDay);
            
            if (nextDate.getDate() !== anchorDay) {
              nextDate.setDate(0);
            }

            const days = Math.round((nextDate - previousDate) / (1000 * 60 * 60 * 24));
            // Банкны өдрийн хүүгийн томьёо: Үлдэгдэл * Жилийн хүү / 365 * Хоног
            const interestPayment = (balance * annualRate) / 365 * days;
            
            let principalPayment;
            let totalPayment;

            if (i === months) {
              // Сүүлийн сард үлдэгдлийг бүрэн хаана
              principalPayment = balance;
              totalPayment = principalPayment + interestPayment;
              balance = 0;
            } else {
              principalPayment = fixedMonthlyPayment - interestPayment;
              totalPayment = fixedMonthlyPayment;
              balance = balance - principalPayment;
            }

            sched.push({
              no: i,
              date: nextDate.toISOString().split('T')[0],
              days: days,
              principal: Math.max(0, principalPayment),
              interest: interestPayment,
              total: totalPayment,
              balance: Math.max(0, balance)
            });

            previousDate = nextDate;
          }
          return sched;
        };

        setScheduleData(generateSchedule());
      }, [amount, months, currentConfig.rate]);

      const monthlyPayment = scheduleData.length > 0 ? scheduleData[0].total : 0;
      const totalPayment = scheduleData.reduce((sum, row) => sum + row.total, 0);

      const formatCurrency = (val) => new Intl.NumberFormat('mn-MN').format(Math.round(val)) + ' ₮';
      const formatDecimalCurrency = (val) => new Intl.NumberFormat('mn-MN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + ' ₮';

      const formatMonthsToYearsAndMonths = (totalMonths) => {
        if (totalMonths < 12) return `${totalMonths} сар`;
        const years = Math.floor(totalMonths / 12);
        const remainingMonths = totalMonths % 12;
        if (remainingMonths === 0) return `${years} жил`;
        return `${years} жил ${remainingMonths} сар`;
      };

      const handleDownloadPdf = async () => {
        const source = document.getElementById('printable-schedule');
        if (!source || isDownloading) return;

        setIsDownloading(true);

        // Create temporary visible foreground clone to guarantee html2canvas renders full vector text
        const container = document.createElement('div');
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '1050px';
        container.style.backgroundColor = '#ffffff';
        container.style.zIndex = '999999';
        container.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.25)';

        const clone = source.cloneNode(true);
        clone.style.width = '1050px';
        clone.style.margin = '0';
        clone.style.padding = '32px';
        clone.style.backgroundColor = '#ffffff';
        clone.style.color = '#0f172a';

        container.appendChild(clone);
        document.body.appendChild(container);

        try {
          // Wait for DOM to stabilize layout
          await new Promise((resolve) => setTimeout(resolve, 150));

          const canvas = await html2canvas(clone, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            windowWidth: 1050,
            width: 1050,
            scrollY: 0,
            scrollX: 0,
            logging: false
          });

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: 'a4'
          });

          const pageWidth = pdf.internal.pageSize.getWidth(); // 297 mm
          const pageHeight = pdf.internal.pageSize.getHeight(); // 210 mm
          const margin = 10;
          const printWidth = pageWidth - (margin * 2); // 277 mm
          const printPageHeight = pageHeight - (margin * 2); // 190 mm

          // Canvas aspect calculation
          const canvasPageHeight = Math.floor(canvas.width * (printPageHeight / printWidth));
          let currentY = 0;
          let pageIndex = 0;

          while (currentY < canvas.height) {
            const sliceHeight = Math.min(canvasPageHeight, canvas.height - currentY);
            const pageCanvas = document.createElement('canvas');
            pageCanvas.width = canvas.width;
            pageCanvas.height = sliceHeight;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
            ctx.drawImage(canvas, 0, currentY, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);

            const pageImgData = pageCanvas.toDataURL('image/jpeg', 0.98);

            if (pageIndex > 0) {
              pdf.addPage();
            }

            const renderHeight = (sliceHeight * printWidth) / canvas.width;
            pdf.addImage(pageImgData, 'JPEG', margin, margin, printWidth, renderHeight);

            currentY += canvasPageHeight;
            pageIndex++;
          }

          pdf.save('zeeliin_ergen_toloh_huvaari.pdf');
        } catch (error) {
          console.error('PDF export error, triggering print fallback:', error);
          window.print();
        } finally {
